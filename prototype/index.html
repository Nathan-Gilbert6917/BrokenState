<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover: on a phone with a notch the page fills the screen; responsive.css keeps the UI out of the
       notch with the safe-area insets. A desktop browser and the desktop app have no insets: nothing changes there. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Broken State — State Map Prototype</title>
  <!-- The web app (Add to Home Screen; README "Play in a browser"): manifest.webmanifest, its icons (desktop/scripts/
       make-icon.js draws them from the desktop icon's art) and iOS's own tags. Every path is relative, as the game is
       served from a sub-folder on GitHub Pages. Read only when a browser offers to install; the desktop app ignores them. -->
  <link rel="icon" href="icons/favicon.ico" sizes="any" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1b1e23" /> <!-- --panel in styles.css: the phone's bar continues the top bar -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" /> <!-- an opaque bar: the page starts below it -->
  <meta name="apple-mobile-web-app-title" content="Broken State" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="title.css" />
  <link rel="stylesheet" href="newrun.css" /> <!-- the new-run screen (src/ui/newgame.js): a full screen, its own phone and tablet rules -->
  <link rel="stylesheet" href="touch.css" />
  <link rel="stylesheet" href="responsive.css" />
  <link rel="stylesheet" href="pad.css" /> <!-- a game controller (src/ui/gamepad.js): only under html.input-pad -->
  <!-- The offline cache's service worker: does nothing in the desktop app, nor over http but on localhost (src/pwa.js).
       Its own module, before main.js, so it runs first and a failure there can never stop the game. -->
  <script type="module" src="src/pwa.js"></script>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <span class="title">BROKEN STATE</span>
      <span class="clock" id="tb-clock"></span>
      <span class="speed row" id="tb-speed"></span>
      <span class="stock" id="tb-stock"></span>
      <span class="threat" id="tb-threat"></span>
      <span id="tb-people"></span>
      <span class="row small" id="tb-tools"></span>
    </header>
    <aside id="left"></aside>
    <main id="mapwrap">
      <canvas id="map"></canvas>
      <div id="legend"></div>
      <div id="orders" class="hidden"></div>
      <div id="devpanel" class="hidden"></div>
      <div id="ctxmenu" class="hidden"></div>
      <div id="tooltip" class="hidden"></div>
      <div id="banner" class="hidden"></div>
      <div id="alerts" class="hidden"></div>
      <div id="watchlist" class="hidden"></div>
      <div id="fps" class="hidden"></div>
    </main>
    <aside id="right"></aside>
    <footer id="log"></footer>
  </div>
  <div id="modal" class="hidden"></div>
  <div id="combat" class="hidden">
    <div id="cbmapwrap"><canvas id="combatmap"></canvas><div id="cbhud"></div><div id="cbbar"></div>
      <div id="cbtop"></div><!-- a raid without the side panel: Heat, the floor, the view, the Menu and the Log button (ui/combat.js renderRaidTop) -->
      <div id="cbcards"></div><!-- its cards over the map: before you go in, the building, the result, the hover details -->
      <div id="cblogwin" class="hidden"><div class="lw-head"><span class="lw-title">📜 Log</span><span class="lw-btns"><button class="mini" data-action="cb-log" data-v="min" data-tip="Fold the log to its title bar (again: open it)">–</button><button class="mini" data-action="cb-log" data-v="close" data-tip="Hide the log (the Log button at the top shows it again)">×</button></span></div><div class="cblog lw-body" id="cblogbody"></div><div class="lw-foot" id="cblogfoot"></div><div class="lw-grip" data-tip="Drag to resize the log"></div></div>
    </div>
    <aside id="cbpanel"></aside>
  </div>
  <div id="guidetip" class="hidden"></div><!-- the first-week guide's note over a window seen for the first time (ui/guide.js renderGuideTip) -->
  <div id="itemmenu" class="hidden"></div>
  <div id="boxview" class="hidden"></div>
  <div id="tip" class="hidden"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
