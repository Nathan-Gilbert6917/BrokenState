import * as Z from "../src/ui/zombiesfx.js";
import * as NEW from "../src/ui/audio.js";

const RATE = 44100;
let OLD = null;

// ---------- measuring ----------
function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const a = -2 * Math.PI / len, wr = Math.cos(a), wi = Math.sin(a);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const ur = re[i + k], ui = im[i + k], vr = re[i + k + len / 2] * cr - im[i + k + len / 2] * ci, vi = re[i + k + len / 2] * ci + im[i + k + len / 2] * cr;
        re[i + k] = ur + vr; im[i + k] = ui + vi; re[i + k + len / 2] = ur - vr; im[i + k + len / 2] = ui - vi;
        const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t;
      }
    }
  }
}
function measure(buf) {
  const L = buf.getChannelData(0), R = buf.numberOfChannels > 1 ? buf.getChannelData(1) : L;
  const n = L.length, m = new Float32Array(n);

  for (let i = 0; i < n; i++) {
    const a = L[i], b = R[i];
    if (Number.isNaN(a) || Number.isNaN(b)) { nan++; continue; }
    peak = Math.max(peak, Math.abs(a), Math.abs(b));
    if (Math.abs(a) >= 0.999 || Math.abs(b) >= 0.999) clip++;
    m[i] = (a + b) / 2;
    sum += m[i] * m[i];
  }
  // Active part: from the first to the last 10 ms window above -50 dBFS.
  const W = Math.floor(RATE * 0.01), wins = [];
  for (let i = 0; i + W <= n; i += W) { let s = 0; for (let k = 0; k < W; k++) s += m[i + k] * m[i + k]; wins.push(Math.sqrt(s / W)); }

  const act = first < 0 ? [] : wins.slice(first, last + 1);

  const pct = (p) => (l5.length ? l5[Math.min(l5.length - 1, Math.floor(p * l5.length))] : 0);
  // Spectrum: 2048-point frames, energy-weighted centroid and flatness over 60 Hz–2 kHz, where the voices live
// (noise-to-tone: 1 white noise, 0 a pure tone).
  const N = 2048, avg = new Float64Array(N / 2);
  let cw = 0, cs = 0, fs = 0;
  for (let i = 0; i + N <= n; i += N / 2) {
    const re = new Float64Array(N), im = new Float64Array(N);
    let e = 0;
    for (let k = 0; k < N; k++) { const w = 0.5 - 0.5 * Math.cos(2 * Math.PI * k / (N - 1)); re[k] = m[i + k] * w; e += re[k] * re[k]; }
    if (e < 1e-6) continue;
    fft(re, im);
    let num = 0, den = 0, lg = 0, ar = 0, cnt = 0;
    for (let k = 1; k < N / 2; k++) {
      const p = re[k] * re[k] + im[k] * im[k], f = k * RATE / N;
      avg[k] += p; num += f * p; den += p;
      if (f >= 60 && f <= 2000) { lg += Math.log(p + 1e-20); ar += p; cnt++; }
    }
    cs += (num / den) * e; fs += (Math.exp(lg / cnt) / (ar / cnt)) * e; cw += e;
  }

  // energy-weighted. 1: a steady pitched tone; lower: rough, noisy, unpitched.
  const F = Math.floor(RATE * 0.04), lo = Math.floor(RATE * 0.0025), hi = Math.floor(RATE * 0.025);
  let pw = 0, ps = 0;
  for (let i = 0; i + F + hi <= n; i += F) {
    let e0 = 0;
    for (let k = 0; k < F; k++) e0 += m[i + k] * m[i + k];
    if (e0 < 1e-5) continue;
    let best = 0;
    for (let lag = lo; lag <= hi; lag += 2) {
      let ab = 0, bb = 0;
      for (let k = 0; k < F; k += 2) { ab += m[i + k] * m[i + k + lag]; bb += m[i + k + lag] * m[i + k + lag]; }
      const r = ab / Math.sqrt((e0 / 2) * bb + 1e-12);
      if (r > best) best = r;
    }
    ps += best * e0; pw += e0;

  return {
    secs: Math.round(n / RATE * 100) / 100, active: first < 0 ? 0 : Math.round((last - first + 1) * 0.01 * 100) / 100,
    peak: Math.round(peak * 1000) / 1000, peakDb: db(peak), rmsDb: db(actRms), crestDb: Math.round((db(peak) - db(actRms)) * 10) / 10,
    lra: Math.round((pct(0.95) - pct(0.1)) * 10) / 10, loudDb: Math.round(pct(0.95) * 10) / 10, clip, nan,
    periodicity: pw ? Math.round(ps / pw * 1000) / 1000 : 0,

  str(0, "RIFF"); data.setUint32(4, 36 + n * ch * 2, true); str(8, "WAVE"); str(12, "fmt "); data.setUint32(16, 16, true);
  data.setUint16(20, 1, true); data.setUint16(22, ch, true); data.setUint32(24, RATE, true); data.setUint32(28, RATE * ch * 2, true);
  data.setUint16(32, ch * 2, true); data.setUint16(34, 16, true); str(36, "data"); data.setUint32(40, n * ch * 2, true);

}
async function render(secs, fn) {
  const c = new OfflineAudioContext(2, Math.ceil(RATE * secs), RATE);
  fn(c, c.destination);
  return c.startRendering();
}
// 50 ms RMS levels (dB) of a render.
function windows(buf) {
  const L = buf.getChannelData(0), R = buf.getChannelData(1), W = Math.floor(RATE * 0.05), out = [];
  for (let i = 0; i + W <= L.length; i += W) { let s = 0; for (let k = 0; k < W; k++) { const v = (L[i + k] + R[i + k]) / 2; s += v * v; } out.push(10 * Math.log10(s / W + 1e-12)); }
  return out;
}
// What the zombie bus's limiter took off: the same mix with and without it, window by window (the deepest, and the
// share of the loud windows it touched by more than 1 dB).
async function reduction(secs, mk) {
  const a = windows(await render(secs, mk(true))), b = windows(await render(secs, mk(false)));
  let deepest = 0, touched = 0, loud = 0;
  for (let i = 0; i < a.length; i++) if (b[i] > -45) { loud++; const d = a[i] - b[i]; deepest = Math.min(deepest, d); if (d < -1) touched++; }
  return { deepestDb: Math.round(deepest * 10) / 10, windowsOver1dB: `${touched}/${loud}` };
}
// The game's chain (ui/audio.js): the zombie bus (+4 dB, the Zombie volume, its soft limiter) into the effects bus, the
// ambience bus, the master, the master compressor. Slider sets: LISTEN (unity, to listen to), DEFAULT and FULL.
const LISTEN = { master: 1, sfx: 1 / Math.sqrt(0.8), amb: 1, zombie: 1, horde: 0.7 }, DEFAULT = { master: 0.7, sfx: 0.8, amb: 0.5, zombie: 1, horde: 0.7 }, FULL = { master: 1, sfx: 1, amb: 1, zombie: 1.5, horde: 1 };
function chain(c, sl = LISTEN, limiter = true) {
  const comp = c.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.25;
  comp.connect(c.destination);
  const master = c.createGain(); master.gain.value = sl.master ** 2; master.connect(comp);
  const sfx = c.createGain(); sfx.gain.value = sl.sfx ** 2 * 0.8; sfx.connect(master);
  const amb = c.createGain(); amb.gain.value = sl.amb ** 2; amb.connect(master);
  const zb = Z.makeZombieBus(c, sfx, { limiter });
  zb.setVolume(sl.zombie, 0, true);
  return { zom: zb.input, sfx, amb, vol: NEW.hordeVolume(sl.horde) * Z.zombieVolume(sl.zombie), comps: { zombieBus: zb.comp, master: comp } };
}
// A voice as the game plays it into the effects bus: through the zombie bus at the default Zombie volume.
function zbus(c, out) { const zb = Z.makeZombieBus(c, out); zb.setVolume(1, 0, true); return zb.input; }

      await keep(`${kind}_${ev}_new`, ev === "shriek" ? 6.4 : ev === "idle" || ev === "death" ? 3.4 : kind === "screamer" && ev === "aggro" ? 3.4 : 2.4, (c, out) => { Z.playZombie(ev, c, zbus(c, out), 0.02, opts); });

  for (let i = 1; i <= 4; i++) { Z.resetTakes(i * 10); const buf = await render(3.4, (c, out) => { Z.playZombie("idle", c, zbus(c, out), 0.02, { kind: "walker", seed: Z.voiceSeed(113, 5), pitch: 1 }); }); stats[`walker_idle_take${i}`] = measure(buf); }

  // The screamer's shriek straight out of the voice, before the zombie bus (does the voice itself clip?).
  await keep("screamer_shriek_raw", 6.4, (c, out) => { Z.playZombie("shriek", c, out, 0.02, { kind: "screamer", seed: SEED("screamer"), pitch: 1 }); }, false);
  await keep("screamer_shriek_dist16_new", 6.6, (c, out) => { Z.playZombie("shriek", c, zbus(c, out), 0.02, { kind: "screamer", seed: SEED("screamer"), pitch: 1, dist: 16, far: true }); });
  // The map sting, old and new (the new one has the distant moans under it).
  await keep("horde_sting_new", 3.2, (c, out) => NEW.VOICES.horde.play(c, out, 0.02, { gain: 1, pitch: 1, seed: 7 }));
  // A horde closing in: the crowd bed rising from 4 to 36 of the dead, 14 tiles off to 1.5, voices popping out. Heard at
  // unity (to listen to), and measured at the default and the full sliders.
  const closing = (sl, lim = true) => (c) => {

    say(2.6, "idle", "runner", 4, 9, 0.6); say(3.2, "shriek", "screamer", 5, 10, 0.55, { far: true }); say(4.4, "aggro", "walker", 6, 7, -0.35);
    say(5.0, "aggro", "brute", 7, 7, 0.2); say(5.9, "spit", "spitter", 8, 6, -0.6); say(6.45, "sizzle", "spitter", 8, 2, 0.1);
    say(6.8, "smash", "brute", 7, 4, 0.2, { mat: "wood" }); say(7.3, "idle", "walker", 9, 3, -0.6); say(7.7, "idle", "walker", 10, 2.5, 0.5);
    say(8.1, "strike", "crawler", 11, 1.5, -0.2); say(8.45, "bite", "walker", 12, 1, 0.1, { human: true }); say(9.1, "hurt", "walker", 12, 1, 0.1); say(9.35, "death", "walker", 12, 1.5, 0.1);

  });

  });
  // A horde of 60, 2 tiles from a base by day (no hive): the louder map horde next to the wind above.
  await keep("map_horde_near_day", 10, (c) => {
    const ch = chain(c), out = ch.amb, layer = Z.makeMapLayer(c, out, 0);
    const h = Z.hordeSizeLevel(60) * Z.hordeDistLevel(2) * 0.8;
    for (let t = 0; t <= 10; t += 0.25) layer.update({ horde: h, hive: 0, near: 2, size: 60, big: Z.hordeSizeLevel(60), night: 0, close: 1 }, t);
  });
  // Three hordes closing on a base at night (300, 150 and 60 of the dead, from 14, 12 and 10 tiles to 2, 2 and 3).
  const three = (sl) => (c) => {
    const ch = chain(c, sl), out = ch.amb, layer = Z.makeMapLayer(c, out, 0);
    const H = [[300, 14, 2], [150, 12, 2], [60, 10, 3]];
    for (let t = 0; t <= 12; t += 0.25) {
      const k = Math.min(1, t / 10);
      let quiet = 1, near = 99, best = 0, big = 0;
      for (const [sz, d0, d1] of H) { const d = d0 + (d1 - d0) * k, v = Z.hordeSizeLevel(sz) * Z.hordeDistLevel(d) * 1.1; quiet *= 1 - Math.min(1, v); near = Math.min(near, d); if (v > best) { best = v; big = Z.hordeSizeLevel(sz); } }
      layer.update({ horde: 1 - quiet, hive: 0, near, size: 510, big, night: 1, close: Z.hordeDistLevel(near) }, t, ch.vol);
    }
    return ch;
  };
  await keep("map_three_hordes_closing", 12, three(LISTEN));
  await keep("map_three_hordes_default_sliders", 12, three(DEFAULT), false);
  await keep("map_three_hordes_full_sliders", 12, three(FULL), false);
  await keep("map_horde_ambience_day_far", 10, (c) => {
    const ch = chain(c), out = ch.amb, layer = Z.makeMapLayer(c, out, 0);
    for (let t = 0; t <= 10; t += 0.25) layer.update({ horde: Z.hordeSizeLevel(40) * Z.hordeDistLevel(10) * 0.8, hive: 0, near: 10, size: 40, big: Z.hordeSizeLevel(40), night: 0, close: Z.hordeDistLevel(10) }, t);
  });
  for (const s of Object.values(stats)) s.specKey = s.spectrum; // kept for the comparison in the main process
  return { files, stats, gr };
};
window.ready = true;
</script>
