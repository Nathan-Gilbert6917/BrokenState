<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Item icons</title>
<style>
  body { margin: 0; padding: 12px; background: #1a1d22; color: #d8dce2; font: 12px/1.3 system-ui, sans-serif; }
  h2 { font-size: 14px; margin: 14px 0 6px; color: #e6c23a; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
  .cell { background: #252a31; border: 1px solid #333944; border-radius: 4px; padding: 4px; text-align: center; }
  .cell img { width: 54px; height: 54px; image-rendering: pixelated; display: block; margin: 0 auto 2px; background: #1c2026; }
  .cell .sm { width: 20px; height: 20px; display: inline-block; margin: 0 2px; }
  .k { font-size: 10px; color: #8a929c; word-break: break-all; }
  .n { font-size: 11px; }
  .miss { outline: 2px solid #c8402f; }
</style>
</head>
<body>
<div id="out">Loading…</div>
<script type="module" src="./itemartpreview.js"></script>
</body>
</html>
