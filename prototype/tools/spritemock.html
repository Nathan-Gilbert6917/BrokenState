<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Survivor sprites: before and after</title>
<style>
  body { margin: 0; padding: 12px; background: #1a1d22; color: #d8dce2; font: 12px/1.3 system-ui, sans-serif; }
  h2 { font-size: 14px; margin: 14px 0 6px; color: #e6c23a; }
  section { display: inline-block; padding: 8px; background: #1a1d22; }
  table { border-collapse: collapse; }
  th { font-weight: normal; color: #8a929c; font-size: 11px; padding: 2px 6px; }
  th.row { text-align: right; color: #d8dce2; }
  td { padding: 3px 4px; background: #252a31; border: 1px solid #333944; text-align: center; vertical-align: bottom; }
  td.before { background: #22262c; }
  img { image-rendering: pixelated; display: block; margin: 0 auto; }
  .cap { font-size: 10px; color: #8a929c; margin-top: 2px; }
</style>
</head>
<body>
<div id="out">Loading…</div>
<script type="module">
import { toCanvas } from "../src/ui/sprites.js";
import { paintSurvivorMock, paintSurvivorBefore, holdOf } from "./spritemock.js";

const SCALE = 2; // CSS pixels a canvas pixel (the canvas is 4 a grid pixel)
const img = (p) => { const cv = toCanvas(p); return `<img src="${cv.toDataURL()}" style="width:${cv.width * SCALE}px;height:${cv.height * SCALE}px">`; };
const LOOKS = {
  slim:    { build: "slim",    skin: "#d9a37c", hairStyle: "ponytail", hair: "#1d1a17", facial: "none",    topStyle: "tshirt",  top: "#7a3b32", pants: "#2b3442", accessory: "glasses", accent: "#2d5fa8" },
  average: { build: "average", skin: "#eac3a2", hairStyle: "short",    hair: "#6b4526", facial: "stubble", topStyle: "jacket",  top: "#3d4a5c", pants: "#3a3a3a", accessory: "cap",     accent: "#b8322a" },
  heavy:   { build: "heavy",   skin: "#7d5233", hairStyle: "buzz",     hair: "#1d1a17", facial: "beard",   topStyle: "flannel", top: "#5a6b3a", pants: "#4f4a3a", accessory: "none",    accent: "#d9b23a" },
};
const ARMOR = { slim: null, average: "vest", heavy: "plate" };
const HOLD_NAME = { none: "unarmed", side: "one hand, at the side", shouldered: "two hands, on the shoulder", bow: "bow, upright", pistol: "one hand, forward", level2: "two hands, level", lowready: "two hands, low ready", tube: "on the shoulder" };
const LOADOUTS = [[null, "unarmed"], ["ar", "AR"], ["shotgun", "shotgun"], ["pistol", "pistol"], ["smg", "SMG"], ["machete", "machete"], ["knife", "knife"], ["sledge", "sledgehammer"], ["pulleybow", "pulley bow"]];

let html = "";
// 1. The holds: before and after, three builds.
html += `<section id="holds"><h2>Weapons in the hands: before (22 × 26) and after (28 × 26)</h2><table><tr><th></th>`;
for (const b of Object.keys(LOOKS)) html += `<th colspan="2">${b}${ARMOR[b] ? `, ${ARMOR[b]}` : ""}</th>`;
html += `</tr><tr><th></th>${Object.keys(LOOKS).map(() => "<th>before</th><th>after</th>").join("")}</tr>`;
for (const [key, name] of LOADOUTS) {
  html += `<tr><th class="row">${name}<div class="cap">${HOLD_NAME[holdOf(key)]}</div></th>`;
  for (const b of Object.keys(LOOKS)) html += `<td class="before">${img(paintSurvivorBefore(LOOKS[b], key, ARMOR[b]))}</td><td>${img(paintSurvivorMock(LOOKS[b], key, ARMOR[b]))}</td>`;
  html += "</tr>";
}
html += "</table></section><br>";
// 2. Helmets and visors (the average look, cap replaced, AR low ready).
const HELM = [["hardhat", null], ["highcut", null], ["milhelmet", null], ["rivethelmet", null], ["footballhelmet", null], ["bikehelmet", null], ["bikehelmet", null, true], ["riothelmet", null], ["riothelmet", null, true], ["highcut", "ballistic"], ["highcut", "ballistic", true], ["hardhat", "riot"]];
const HELM_NAME = { hardhat: "hard hat", highcut: "high-cut", milhelmet: "combat", rivethelmet: "riveted scrap", footballhelmet: "football", bikehelmet: "motorcycle", riothelmet: "riot" };
html += `<section id="helmets"><h2>Helmets and visors (the cap replaced; a visor as the game's state says)</h2><table><tr>`;
for (const [h, v, up] of HELM) html += `<th>${HELM_NAME[h]}${v ? `<br>${v} visor` : ""}${h === "bikehelmet" || h === "riothelmet" || v ? `<br>${up ? "visor up" : "visor down"}` : ""}</th>`;
html += "</tr><tr>";
for (const [h, v, up] of HELM) html += `<td>${img(paintSurvivorMock(LOOKS.average, "ar", "vest", { helmet: h, visor: v, visorUp: !!up }))}</td>`;
html += "</tr></table></section><br>";
// 3. Armour and the pack.
const ARM = [[null, "none"], ["vest", "vest"], ["plate", "plate carrier"], ["padding", "padding"], ["tirevest", "tire vest"], ["sportspads", "sports pads"], ["scrapvest", "scrap vest"]];
html += `<section id="armour"><h2>Armour: straps, the top light and a hem; the worn pack</h2><table><tr><th></th>`;
for (const [, n] of ARM) html += `<th>${n}</th>`;
html += `<th>vest + pack</th><th>none + pack</th></tr>`;
for (const [who, o] of [["before", null], ["after", {}]]) {
  html += `<tr><th class="row">${who}</th>`;
  for (const [k] of ARM) html += `<td${o ? "" : ' class="before"'}>${img(o ? paintSurvivorMock({ ...LOOKS.average, top: "#4d5440" }, "machete", k) : paintSurvivorBefore({ ...LOOKS.average, top: "#4d5440" }, "machete", k))}</td>`;
  if (o) html += `<td>${img(paintSurvivorMock({ ...LOOKS.average, top: "#4d5440" }, "machete", "vest", { pack: true }))}</td><td>${img(paintSurvivorMock({ ...LOOKS.average, top: "#4d5440" }, "machete", null, { pack: true }))}</td>`;
  else html += `<td class="before">${img(paintSurvivorBefore({ ...LOOKS.average, top: "#4d5440", accessory: "backpack" }, "machete", "vest"))}<div class="cap">(accessory)</div></td><td class="before"></td>`;
  html += "</tr>";
}
html += "</table></section>";
document.getElementById("out").innerHTML = html;
document.body.dataset.ready = "1";
</script>
</body>
</html>
